[project]
name = "ravel-workshop"
version = "0.2.1"
description = "Unravel — explore how your app works with source evidence and controlled experiments"
requires-python = ">=3.12"
dependencies = [
  "aiosqlite>=0.20.0",
  "psutil>=6.0.0",
  "tree-sitter>=0.25.0,<0.26",
  "tree-sitter-python==0.25.0",
  "tree-sitter-javascript==0.25.0",
  "tree-sitter-typescript==0.23.2",
  "alembic>=1.16.0",
  "anthropic>=0.57.1",
  "fastapi>=0.116.0",
  "httpx>=0.28.1",
  "pydantic-settings>=2.10.1",
  "python-dotenv>=1.1.1",
  "sqlalchemy>=2.0.41",
  "uvicorn[standard]>=0.35.0",
]

[project.optional-dependencies]
browser = ["playwright>=1.56.0,<2"]
legacy = ["asyncpg>=0.30.0", "google-genai>=1.16.0", "langgraph>=0.6.0", "openai>=1.95.1", "pgvector>=0.4.1"]
dev = [
  "pytest>=8.4.1",
  "pytest-asyncio>=1.0.0",
]

[project.scripts]
ravel = "apps.ravel.cli:main"
unravel = "apps.ravel.cli:main"

[tool.setuptools.packages.find]
include = ["packages*", "apps*"]
namespaces = true

[tool.setuptools.cmdclass]
build_py = "build_support.RavelBuild"

[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["apps/ravel/tests"]
